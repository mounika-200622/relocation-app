<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nira</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08090d; color: #eef0f7; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
    h1 { font-family: Georgia, serif; font-style: italic; font-size: 56px; margin: 0; }
    h1 span { color: #8b8ef8; }
    p { color: #a1a9bc; max-width: 320px; line-height: 1.6; }
    code { color: #eef0f7; }
  </style>
</head>
<body>
  <!-- Shown only if the app was built without a server URL. Normally the app opens the
       Nira server configured in capacitor.config.ts (NIRA_SERVER_URL). -->
  <main>
    <h1>Nira<span>.</span></h1>
    <p>Can't reach the Nira server. Start it on your laptop with <code>npm run dev:lan</code>, then rebuild the app with <code>NIRA_SERVER_URL</code> pointing at it.</p>
  </main>
</body>
</html>
