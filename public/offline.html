<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · Nira</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08090d; color: #eef0f7; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }

    h1 span { color: #8b8ef8; }
    p { color: #a1a9bc; max-width: 320px; line-height: 1.6; }
    button { margin-top: 16px; background: #6366f1; color: white; border: 0; border-radius: 12px; padding: 12px 20px; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <h1>Nira<span>.</span></h1>
    <p>You're offline. Nira needs a connection for live listings, chat and maps. Check your Wi-Fi or mobile data and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>

</html>
