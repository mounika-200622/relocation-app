# Local databases for Nira. Start with: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: nira-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nira
      MYSQL_USER: nira
      MYSQL_PASSWORD: nira_password
      MYSQL_ROOT_PASSWORD: nira_root_password
    # log_bin_trust_function_creators lets migrations create the stored function/trigger
    command: ["--log-bin-trust-function-creators=1", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - nira-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:7
    container_name: nira-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - nira-mongo:/data/db

volumes:
  nira-mysql:
  nira-mongo:
